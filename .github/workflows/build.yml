name: Build JungleScript Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name JungleScriptInstaller installer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JungleScriptInstaller
          path: dist/JungleScriptInstaller.exe